<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Админка</title>
	<link rel="stylesheet" href="css/kurilka.css">
	<link rel="stylesheet" href="css/null.css">
	<style>
		.admin-wrapper {
			max-width: 900px;
			margin: 0 auto;
			padding: 40px 20px;
			color: #fff;
		}

		.admin-wrapper h1 {
			margin-bottom: 20px;
		}

		.admin-login input {
			width: 100%;
			padding: 12px;
			font-size: 18px;
			margin-bottom: 10px;
			border-radius: 6px;
			border: 1px solid #ccc;
		}

		.admin-login button,
		.admin-delete {
			background: #e52c67c3;
			color: #fff;
			border: 1px solid #ccc;
			padding: 10px 20px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 16px;
		}

		.admin-login button:hover,
		.admin-delete:hover {
			background: #c92358;
		}

		.admin-comment {
			background: rgba(0, 0, 0, 0.55);
			backdrop-filter: blur(6px);
			padding: 15px 20px;
			border-radius: 8px;
			margin-bottom: 12px;
			border: 1px solid rgba(255, 255, 255, 0.3);
		}

		.admin-comment .meta {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
			flex-wrap: wrap;
			gap: 10px;
		}

		.admin-comment .who {
			font-weight: bold;
			font-size: 18px;
		}

		.admin-comment .when {
			color: rgba(255, 255, 255, 0.7);
			font-size: 14px;
		}

		.admin-comment .body {
			font-size: 18px;
			line-height: 1.4;
			margin-bottom: 10px;
			white-space: pre-wrap;
		}

		.admin-status {
			margin: 10px 0;
			color: #ffb3c9;
		}

		.hidden {
			display: none;
		}
	</style>
</head>

<body>

	<div class="admin-wrapper">
		<h1>Админка — Беседка</h1>

		<div id="loginBlock" class="admin-login">
			<input type="password" id="password" placeholder="Пароль администратора">
			<button onclick="login()">Войти</button>
			<div id="loginStatus" class="admin-status"></div>
		</div>

		<div id="adminBlock" class="hidden">
			<button onclick="logout()" style="margin-bottom:20px;">Выйти</button>
			<div id="adminComments">Загрузка...</div>
		</div>
	</div>

	<script>
		const API = '';
		let token = localStorage.getItem('adminToken') || '';

		const loginBlock = document.getElementById('loginBlock');
		const adminBlock = document.getElementById('adminBlock');
		const loginStatus = document.getElementById('loginStatus');
		const adminComments = document.getElementById('adminComments');

		function showAdmin() {
			loginBlock.classList.add('hidden');
			adminBlock.classList.remove('hidden');
			loadForAdmin();
		}

		function showLogin() {
			adminBlock.classList.add('hidden');
			loginBlock.classList.remove('hidden');
		}

		async function login() {
			const password = document.getElementById('password').value;
			if (!password) { loginStatus.textContent = 'Введите пароль'; return; }
			try {
				const res = await fetch(API + '/admin/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ password })
				});
				if (!res.ok) {
					loginStatus.textContent = 'Неверный пароль';
					return;
				}
				const data = await res.json();
				token = data.token;
				localStorage.setItem('adminToken', token);
				loginStatus.textContent = '';
				showAdmin();
			} catch (e) {
				loginStatus.textContent = 'Ошибка соединения';
			}
		}

		function logout() {
			token = '';
			localStorage.removeItem('adminToken');
			window.location.href = 'kurilka.html';
		}

		function escapeHtml(str) {
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;');
		}

		async function loadForAdmin() {
			try {
				const res = await fetch(API + '/comments');
				const comments = await res.json();
				if (!comments.length) {
					adminComments.innerHTML = '<p>Комментариев нет.</p>';
					return;
				}
				adminComments.innerHTML = comments.map(c => {
					const date = new Date(c.createdAt).toLocaleString('ru-RU');
					return `
						<div class="admin-comment">
							<div class="meta">
								<span class="who">${escapeHtml(c.name || 'Аноним')}</span>
								<span class="when">${date}</span>
							</div>
							<div class="body">${escapeHtml(c.text || '')}</div>
							<button class="admin-delete" onclick="deleteComment('${c._id}')">Удалить</button>
						</div>
					`;
				}).join('');
			} catch (e) {
				adminComments.innerHTML = '<p>Ошибка загрузки</p>';
			}
		}

		async function deleteComment(id) {
			if (!confirm('Удалить комментарий навсегда?')) return;
			try {
				const res = await fetch(API + '/comments/' + id, {
					method: 'DELETE',
					headers: { 'x-admin-token': token }
				});
				if (res.ok) {
					loadForAdmin();
				} else {
					alert('Ошибка удаления. Возможно, пароль устарел — выйди и войди снова.');
				}
			} catch (e) {
				alert('Ошибка соединения');
			}
		}

		// Автовход, если токен уже сохранён
		if (token) showAdmin();
	</script>

</body>

</html>
